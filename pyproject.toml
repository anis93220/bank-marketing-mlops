[project]
name = "bank-marketing-entrainement"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.1.1",
    "pandera>=0.36.0",
    "pyarrow>=26.0.1",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlops_projet"]
